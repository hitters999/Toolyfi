<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0a1f2e" />
    <title>Page Not Found | Toolyfi</title>
    <style>
      :root{--ink:#0a1f2e;--paper:#f7f2e9;--coral:#ff6e61;--line:rgba(10,31,46,.15)}
      *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
      main{min-height:100vh;display:grid;place-items:center;padding:28px;background-image:linear-gradient(rgba(10,31,46,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(10,31,46,.045) 1px,transparent 1px);background-size:28px 28px}
      article{width:min(680px,100%);border:1px solid var(--line);background:rgba(255,255,255,.72);box-shadow:10px 10px 0 rgba(255,110,97,.17);padding:clamp(28px,6vw,64px)}
      .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
      .brand img{width:38px;height:38px;object-fit:contain}.eyebrow{margin:56px 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#45606f}
      h1{font-family:Georgia,serif;font-size:clamp(42px,9vw,78px);line-height:.94;margin:0;letter-spacing:-.055em}p{max-width:530px;font-size:18px;line-height:1.65;margin:24px 0;color:#314a58}
      .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:1px solid var(--ink);font-weight:800;text-decoration:none;color:var(--ink);transition:transform .16s ease,background .16s ease}.button.primary{background:var(--coral)}.button:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}.button:focus-visible{outline:3px solid #0a6b86;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <article>
        <a class="brand" href="/" aria-label="Toolyfi home"><img src="/logo.png" alt="Toolyfi" />TOOLYFI</a>
        <p class="eyebrow">404 · Page not found</p>
        <h1>This route<br />is retired.</h1>
        <p>The page may have moved, been renamed, or no longer be available. Use the current tool directory to find a working Toolyfi utility.</p>
        <div class="actions">
          <a class="button primary" href="/">Browse all tools</a>
          <a class="button" href="/image-compressor.html">Image Compressor</a>
          <a class="button" href="/markdown-to-html-seo.html">Markdown to HTML</a>
        </div>
      </article>
    </main>
  </body>
</html>
