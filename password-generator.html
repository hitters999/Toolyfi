<style>
  :root {
    --bg: #080810;
    --card: #0f0f1a;
    --card2: #14141f;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #c84fff;
    --accent3: #00f5c3;
    --text: #eeeeff;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;

  /* BG GLOW */

    justify-content: space-between;

    z-index: 100;

    -webkit-text-fill-color: transparent;

  .nav-links { list-style: none; display: flex; gap: 24px; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }

  .pg-wrap {

    position: relative;
    z-index: 1;

  .breadcrumb {

    color: var(--muted);

  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }

  .header-icon {

  @keyframes floatIcon {

  }
  .tool-header h1 {
    font-family: 'Clash Display', sans-serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.03em;

    -webkit-text-fill-color: transparent;

  .tool-header p {

    border: 1px solid rgba(108,99,255,0.22);
    color: #a49dff;
    font-size: 0.72rem;
    padding: 4px 13px;
    border-radius: 100px;
    font-weight: 500;
    letter-spacing: 0.02em;

  /* PASSWORD OUTPUT */
  .pw-output-box {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;

  .pw-output-box.strong-glow {

    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 14px;

  .pw-text {
    font-family: 'DM Mono', monospace;
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    color: var(--text);
    word-break: break-all;
    line-height: 1.5;
    letter-spacing: 0.05em;
    min-height: 48px;
    padding: 4px 0;
    transition: all 0.2s;
  }
  .pw-text .char-upper { color: #c084fc; }
  .pw-text .char-num   { color: #60a5fa; }
  .pw-text .char-sym   { color: #f97316; }
  .pw-text .char-lower { color: var(--text); }

  /* STRENGTH BAR */
  .strength-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;

    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    overflow: hidden;
  }
  .strength-bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1), background 0.4s;

    background: var(--muted);

  .strength-label {
    font-size: 0.78rem;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    min-width: 72px;
    text-align: right;
    transition: color 0.3s;
    color: var(--muted);
  }

  /* QUICK ACTION BUTTONS */

    display: flex;
    gap: 10px;
    margin-bottom: 20px;

    border-radius: 14px;
    padding: 15px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 24px rgba(108,99,255,0.3);
    letter-spacing: 0.02em;

    overflow: hidden;

    font-size: 0.72rem;

    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;

    justify-content: space-between;

    margin-bottom: 14px;

    font-size: 1.6rem;

    padding: 2px 16px;
    border-radius: 10px;
    min-width: 60px;
    text-align: center;
  }
  .slider-wrap {
    position: relative;
    padding: 8px 0;
    margin-bottom: 6px;
  }
  .pw-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    outline: none;
    cursor: pointer;
  }
  .pw-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    cursor: pointer;
    box-shadow: 0 0 12px rgba(108,99,255,0.5);
    transition: transform 0.15s;
  }
  .pw-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 2px;
  }

  /* CHECKBOXES */
  .check-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 22px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .check-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
  .check-item.on {
    background: rgba(108,99,255,0.08);
    border-color: rgba(108,99,255,0.3);
  }
  .check-item input { display: none; }
  .check-box {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 0.7rem;
  }
  .check-item.on .check-box {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
  }
  .check-info { flex: 1; }
  .check-name { font-size: 0.87rem; font-weight: 500; color: var(--text); }
  .check-example { font-size: 0.7rem; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

  .presets-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .preset-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }
  .preset-btn:hover { background: rgba(108,99,255,0.12); color: #a49dff; border-color: rgba(108,99,255,0.3); }

  /* HISTORY */
  .history-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .history-item
