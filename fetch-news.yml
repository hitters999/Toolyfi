name: 🚀 Toolyfi Auto News Fetch

on:
  schedule:
    - cron: '0 9 * * *'
  
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📝 Create Fetch Script
        run: |
          mkdir -p scripts
          cat > scripts/fetch-news.js << 'SCRIPT_EOF'
          #!/usr/bin/env node
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          
          const NEWS_API_KEY = process.env.NEWS_API_KEY;
          const NEWS_API_URL = 'https://newsapi.org/v2/everything';
          const ARTICLES_DIR = './updatesworld';
          
          const KEYWORDS = [
            'calculator OR salary OR financial tools',
            'technology trends OR programming',
            'sports statistics',
            'currency converter OR forex',
            'health calculator OR fitness'
          ];
          
          function fetchNews(keyword) {
            return new Promise((resolve, reject) => {
              const params = new URLSearchParams({
                q: keyword,
                sortBy: 'publishedAt',
                language: 'en',
                apiKey: NEWS_API_KEY,
                pageSize: 5
              });
              const url = `${NEWS_API_URL}?${params.toString()}`;
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data).articles || []);
                  } catch (e) {
                    reject(e);
                  }
                });
              }).on('error', reject);
            });
          }
          
          function generateSlug(title) {
            return title.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').substring(0, 50);
          }
          
          function createArticleHTML(article, slug) {
            const { title, description, content, urlToImage, url, author, publishedAt, source } = article;
            const publicationDate = new Date(publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const imageUrl = urlToImage || 'https://toolyfi.com/images/default-og.jpg';
            
            return `<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${title} | Updates World | Toolyfi</title>
              <meta name="uw-title" content="${title}">
              <meta name="description" content="${description || 'Latest news'}">
              <meta property="og:title" content="${title}">
              <meta property="og:description" content="${description || 'Latest news'}">
              <meta property="og:image" content="${imageUrl}">
              <meta name="author" content="${author || source.name}">
              <meta name="published_date" content="${publishedAt}">
              <link rel="canonical" href="https://toolyfi.com/updatesworld/${slug}.html">
              <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y3ETYH2QF0"></script>
              <script>
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-Y3ETYH2QF0');
              </script>
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
                .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); overflow: hidden; }
                .hero-image { width: 100%; height: 400px; object-fit: cover; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
                .article-header { padding: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
                .source-badge { display: inline-block; background: rgba(255, 255, 255, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
                .article-header h1 { font-size: 2.5em; font-weight: bold; margin-bottom: 15px; line-height: 1.2; }
                .article-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; opacity: 0.9; }
                .article-content { padding: 40px; }
                .article-content p { margin-bottom: 15px; font-size: 16px; line-height: 1.8; }
                .read-more { display: inline-block; margin-top: 20px; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: transform 0.3s; }
                .read-more:hover { transform: translateY(-2px); }
                .back-link { display: inline-block; padding: 40px 40px 0; color: #667eea; text-decoration: none; font-weight: bold; }
                .back-link:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                <img src="${imageUrl}" alt="${title}" class="hero-image" onerror="this.style.display='none'">
                <div class="article-header">
                  <div class="source-badge">📰 ${source.name}</div>
                  <h1>${title}</h1>
                  <div class="article-meta">
                    <span>📅 ${publicationDate}</span>
                    <span>✍️ ${author || source.name}</span>
                    <span>📊 Updates World</span>
                  </div>
                </div>
                <div class="article-content">
                  <p>${description || ''}</p>
                  <a href="${url}" target="_blank" class="read-more">📖 Read Full Article on ${source.name}</a>
                </div>
                <a href="/updatesworld/updatesworld.html" class="back-link">← Back to Updates World</a>
              </div>
          </body>
          </html>`;
          }
          
          async function main() {
            console.log('🚀 Fetching news...');
            if (!NEWS_API_KEY) { console.error('❌ NEWS_API_KEY not set'); process.exit(1); }
            try {
              if (!fs.existsSync(ARTICLES_DIR)) fs.mkdirSync(ARTICLES_DIR, { recursive: true });
              let allArticles = [];
              for (const keyword of KEYWORDS) {
                try {
                  console.log(`🔍 Fetching: "${keyword}"...`);
                  const articles = await fetchNews(keyword);
                  allArticles = [...allArticles, ...articles];
                  console.log(`✅ Got ${articles.length} articles`);
                } catch (err) {
                  console.error(`❌ Error:`, err.message);
                }
              }
              const uniqueArticles = Array.from(new Map(allArticles.map(a => [a.url, a])).values()).slice(0, 10);
              console.log(`\n📊 Creating ${uniqueArticles.length} articles...\n`);
              let created = 0;
              for (const article of uniqueArticles) {
                try {
                  const slug = generateSlug(article.title);
                  const filePath = path.join(ARTICLES_DIR, `${slug}.html`);
                  if (fs.existsSync(filePath)) {
                    console.log(`⏭️  Skipped (exists): ${slug}`);
                    continue;
                  }
                  fs.writeFileSync(filePath, createArticleHTML(article, slug));
                  created++;
                  console.log(`✅ Created: ${slug}.html`);
                } catch (err) {
                  console.error(`❌ Error:`, err.message);
                }
              }
              console.log(`\n🎉 Done! Created ${created} articles.`);
            } catch (err) {
              console.error('❌ Fatal:', err);
              process.exit(1);
            }
          }
          main();
          SCRIPT_EOF
      
      - name: 🔑 Run News Fetch
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-news.js
      
      - name: 📤 Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Toolyfi Bot"
          
          if [[ -z $(git status -s) ]]; then
            echo "✅ No changes to commit"
          else
            git add updatesworld/
            git commit -m "🔄 Auto: Fetch latest news articles $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Pushed changes"
          fi
      
      - name: ✅ Done
        run: echo "🎉 News fetch completed!"