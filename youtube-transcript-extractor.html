<script>
  let currentAnalysis = "", currentTranscript = "", currentVideoId = "";

  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
      /youtube\.com\/shorts\/([^&\n?#]+)/
    ];
    for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
    return null;
  }

  function showStatus(id) {
    ["s-fetch","s-analyze","s-error"].forEach(s => document.getElementById(s).classList.remove("show"));
    if (id) document.getElementById(id).classList.add("show");
  }

  async function fetchTranscript(vid) {
    // Same as before (3 methods) – unchanged
    try {
      const url = `https://corsproxy.io/?${encodeURIComponent("https://www.youtube.com/api/timedtext?lang=en&v="+vid+"&fmt=json3")}`;
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (res.ok) {
        const data = await res.json();
        if (data && data.events) {
          const text = data.events.filter(e => e.segs).map(e => e.segs.map(s => s.utf8 || "").join("")).join(" ").replace(/\s+/g, " ").trim();
          if (text.length > 50) return text;
        }
      }
    } catch(e) {}

    try {
      const inner = encodeURIComponent("https://www.youtube.com/api/timedtext?lang=en&v="+vid+"&fmt=json3");
      const res = await fetch("https://api.allorigins.win/get?url="+inner, { signal: AbortSignal.timeout(8000) });
      if (res.ok) {
        const raw = await res.json();
        const data = JSON.parse(raw.contents || "{}");
        if (data && data.events) {
          const text = data.events.filter(e => e.segs).map(e => e.segs.map(s => s.utf8 || "").join("")).join(" ").replace(/\s+/g, " ").trim();
          if (text.length > 50) return text;
        }
      }
    } catch(e) {}

    try {
      const res = await fetch("https://api.youtubetranscript.com/?videoId="+vid, { signal: AbortSignal.timeout(8000) });
      const data = await res.json();
      if (data && data.transcript && data.transcript.length > 0) return data.transcript.map(t => t.text).join(" ");
    } catch(e) {}

    return null;
  }

  async function startAnalysis() {
    const url = document.getElementById("yt-url").value.trim();
    const vid = extractVideoId(url);
    if (!vid) {
      document.getElementById("error-msg").textContent = "Please enter a valid YouTube URL";
      showStatus("s-error");
      return;
    }
    currentVideoId = vid;
    currentTranscript = "";
    currentAnalysis = "";
    document.getElementById("analyse-btn").disabled = true;
    document.getElementById("result-wrap").classList.remove("show");
    showStatus("s-fetch");

    const transcriptText = await fetchTranscript(vid);
    if (transcriptText) currentTranscript = transcriptText;
    await analyzeWithAI(vid, currentTranscript || null);
  }

  async function analyzeWithAI(vid, transcript) {
    showStatus("s-analyze");

    const prompt = transcript
      ? `You are an expert content analyst. Analyze this YouTube video transcript and provide:\n\n1. Main Topic & Summary (3-4 sentences)\n2. Core Strategy / Key Message\n3. Top 7 Key Points (bullet points)\n4. Actionable Tips & Lessons\n5. Step-by-step Action Plan\n6. One-line Conclusion\n\nTranscript:\n${transcript.slice(0, 7000)}`
      : `The YouTube video ID is: ${vid}. Transcript could not be automatically fetched... (same as before)`;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": "YOUR_API_KEY_HERE",                    // ← YAHAN APNI KEY PASTE KARO
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",                          // ← Latest 2026 model
          max_tokens: 1500,
          messages: [{ role: "user", content: prompt }]
        })
      });

      if (!response.ok) throw new Error("API Error: " + response.status);
      const result = await response.json();
      currentAnalysis = result.content?.[0]?.text || "Analysis failed. Try again.";
      showResult(vid);
    } catch(e) {
      document.getElementById("error-msg").textContent = "Analysis failed. Check your API key or try again.";
      showStatus("s-error");
      document.getElementById("analyse-btn").disabled = false;
    }
  }

  // Baaki functions (showResult, copy, reset etc.) same hain – unchanged
  function showResult(vid) { /* original code yahan paste kar do */ }
  function copyAnalysis() { /* original */ }
  function copyTranscript() { /* original */ }
  function resetTool() { /* original */ }

  document.getElementById("yt-url").addEventListener("keydown", e => {
    if (e.key === "Enter") startAnalysis();
  });
</script>
