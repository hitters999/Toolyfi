name: Toolyfi Auto News Fetch
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Fetch News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node << 'SCRIPT'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          const API_KEY = process.env.NEWS_API_KEY;
          const API_URL = 'https://newsapi.org/v2/everything';
          const DIR = './updatesworld';
          const KEYWORDS = ['calculator OR salary', 'technology', 'sports', 'forex', 'health'];
          function fetch_news(q) {
            return new Promise((resolve, reject) => {
              const url = `${API_URL}?q=${q}&apiKey=${API_KEY}&pageSize=5&sortBy=publishedAt`;
              https.get(url, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data).articles || []);
                  } catch (e) {
                    reject(e);
                  }
                });
              }).on('error', reject);
            });
          }
          async function run() {
            if (!API_KEY) { console.error('No API key'); return; }
            if (!fs.existsSync(DIR)) fs.mkdirSync(DIR);
            let articles = [];
            for (const kw of KEYWORDS) {
              try {
                const res = await fetch_news(kw);
                articles = [...articles, ...res];
              } catch (e) {
                console.log('Error:', kw);
              }
            }
            const unique = Array.from(new Map(articles.map(a => [a.url, a])).values()).slice(0, 10);
            let count = 0;
            for (const art of unique) {
              const title = art.title || 'News';
              const slug = title.toLowerCase().replace(/[^a-z0-9-]/g, '').substring(0, 50);
              const filepath = `${DIR}/${slug}.html`;
              if (fs.existsSync(filepath)) continue;
              const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>${title}</title><meta name="uw-title" content="${title}"><meta property="og:image" content="${art.urlToImage || 'https://toolyfi.com/images/default-og.jpg'}"><script async src="https://www.googletagmanager.com/gtag/js?id=G-Y3ETYH2QF0"></script><script>gtag=window.gtag||function(){};gtag('config','G-Y3ETYH2QF0');</script><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f7fa}.header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:30px;border-radius:10px}h1{margin:0;font-size:1.8em}img{max-width:100%;height:auto;margin:20px 0}a{color:#667eea;text-decoration:none}</style></head><body><div class="header"><h1>${title}</h1><p>${art.source.name} • ${new Date(art.publishedAt).toLocaleDateString()}</p></div><img src="${art.urlToImage||''}" onerror="this.style.display='none'"><p>${art.description || ''}</p><a href="${art.url}" target="_blank">Read Full Article →</a><hr><a href="/updatesworld/updatesworld.html">← Back</a></body></html>`;
              fs.writeFileSync(filepath, html);
              count++;
              console.log(`✅ ${slug}.html`);
            }
            console.log(`Done! Created ${count} articles`);
          }
          run();
        SCRIPT
      - run: |
          git config user.email "bot@toolyfi.com"
          git config user.name "Toolyfi Bot"
          git add updatesworld/ || true
          git commit -m "Auto: News articles" || true
          git push origin main || true
