name: Toolyfi Auto News Fetch
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: mkdir -p updatesworld
      - run: |
          node << 'SCRIPT'
          const https = require("https");
          const fs = require("fs");
          const API = process.env.NEWS_API_KEY;
          if (!API) process.exit(1);
          const kw = ["calculator","technology"];
          async function go() {
            for (const k of kw) {
              const url = `https://newsapi.org/v2/everything?q=${k}&apiKey=${API}&pageSize=3`;
              await new Promise(r => https.get(url, res => {
                let d = "";
                res.on("data", x => d += x);
                res.on("end", () => {
                  try {
                    JSON.parse(d).articles.forEach(a => {
                      const s = a.title.toLowerCase().replace(/[^a-z0-9-]/g,"").substring(0,40);
                      const f = `updatesworld/${s}.html`;
                      if (!fs.existsSync(f)) {
                        fs.writeFileSync(f, `<html><meta charset=utf-8><title>${a.title}</title><meta name=uw-title content="${a.title}"><h1>${a.title}</h1><p>${a.description}</p><a href="${a.url}">Read</a>`);
                        console.log("✅");
                      }
                    });
                  } catch(e) {}
                  r();
                });
              }).on("error", r));
            }
          }
          go();
          SCRIPT
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      - run: |
          git config user.email bot@toolyfi.com
          git config user.name "Toolyfi Bot"
          git add updatesworld/ || true
          git commit -m "Auto news" || true
          git push origin main || true
