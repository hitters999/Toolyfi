<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Toolyfi Scientific Calculator workspace</title>
    <style>
      :root {
        --shell-top: #f2f0e9;
        --shell-mid: #d9d9d4;
        --shell-edge: #a9aaa7;
        --shell-shadow: rgba(24, 31, 35, 0.25);
        --ink: #1a252b;
        --muted: #616d70;
        --lcd: #b8c5a6;
        --lcd-ink: #20301e;
        --key-top: #f9f8f4;
        --key-mid: #e3e2dc;
        --key-edge: #a9aaa5;
        --function-top: #59696f;
        --function-mid: #344248;
        --function-edge: #202a2e;
        --coral-top: #f48465;
        --coral-mid: #d55640;
        --coral-edge: #923424;
        --orange-top: #edb16b;
        --orange-mid: #cc7d38;
        --orange-edge: #8a4b1d;
        --blue-top: #718e9d;
        --blue-mid: #46626f;
        --blue-edge: #293f49;
        --shift: #e1912d;
        --alpha: #b45d7d;
        --focus: #0d6d75;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 14px;
        background: transparent;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      button {
        font: inherit;
      }

      .calculator-app {
        width: min(100%, 494px);
        margin: auto;
      }

      .calculator-body {
        position: relative;
        overflow: hidden;
        min-height: 830px;
        padding: 20px 18px 26px;
        border: 1px solid #91938f;
        border-radius: 22px 22px 38px 38px;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.74), transparent 23%),
          linear-gradient(170deg, var(--shell-top) 0%, var(--shell-mid) 54%, #c4c6c2 100%);
        box-shadow:
          0 18px 26px var(--shell-shadow),
          0 34px 56px rgba(0, 0, 0, 0.3),
          inset 1px 1px 0 rgba(255, 255, 255, 0.9),
          inset -1px -3px 0 rgba(91, 95, 92, 0.24);
      }

      .calculator-body::after {
        position: absolute;
        right: -58px;
        bottom: -78px;
        width: 240px;
        height: 180px;
        border-radius: 50%;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.18), transparent 68%);
        content: "";
        pointer-events: none;
      }

      .brand-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        min-height: 43px;
        margin: 0 8px 10px;
      }

      .toolyfi-brand {
        color: #1c2c36;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.95;
      }

      .toolyfi-brand span {
        color: #ef6c54;
      }

      .model-line {
        display: block;
        margin-top: 5px;
        color: #5e6667;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 7px;
        font-weight: 800;
        letter-spacing: 0.22em;
      }

      .quiet-mark {
        max-width: 130px;
        color: #737775;
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.4;
        text-align: right;
        text-transform: uppercase;
      }

      .screen-shell {
        position: relative;
        margin-bottom: 13px;
        padding: 7px;
        border: 1px solid #69706b;
        border-radius: 7px;
        background: linear-gradient(150deg, #777d77, #3d4541);
        box-shadow:
          inset 1px 1px 0 rgba(255, 255, 255, 0.24),
          0 2px 0 rgba(255, 255, 255, 0.48);
      }

      .lcd {
        min-height: 104px;
        padding: 10px 12px;
        border: 1px solid #7e8875;
        border-radius: 3px;
        background:
          linear-gradient(105deg, rgba(255, 255, 255, 0.13), transparent 43%),
          linear-gradient(180deg, #c8d4b6, var(--lcd));
        box-shadow:
          inset 0 2px 7px rgba(58, 75, 47, 0.32),
          inset 1px 1px 0 rgba(246, 255, 235, 0.35);
        color: var(--lcd-ink);
      }

      .lcd-status {
        display: flex;
        justify-content: space-between;
        min-height: 14px;
        font-family: "Courier New", monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .lcd-status .state-flags {
        display: flex;
        gap: 8px;
      }

      .lcd-status .is-on {
        color: #7a4617;
      }

      .expression-line {
        display: flex;
        min-height: 27px;
        margin-top: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        font-family: "Courier New", monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .lcd-caret {
        width: 1.5px;
        min-width: 1.5px;
        height: 19px;
        margin: 1px 1px 0 1px;
        background: var(--lcd-ink);
      }

      .result-line {
        min-height: 37px;
        margin-top: 2px;
        overflow: hidden;
        font-family: "Courier New", monospace;
        font-size: clamp(21px, 6vw, 29px);
        font-weight: 700;
        letter-spacing: -0.08em;
        line-height: 1.25;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-line.error {
        color: #8e2716;
        font-size: 15px;
        letter-spacing: 0;
        padding-top: 9px;
      }

      .memory-line {
        min-height: 12px;
        margin-top: 2px;
        font-family: "Courier New", monospace;
        font-size: 9px;
        font-weight: 700;
        text-align: right;
      }

      .top-controls {
        display: grid;
        grid-template-columns: 0.85fr 0.85fr 1.7fr 0.9fr 0.9fr 0.85fr;
        gap: 7px;
        align-items: center;
        margin: 0 0 13px;
      }

      .physical-key {
        position: relative;
        min-width: 0;
        min-height: 39px;
        padding: 4px;
        border: 1px solid var(--key-edge);
        border-radius: 7px;
        background: linear-gradient(180deg, var(--key-top), var(--key-mid));
        box-shadow:
          0 3px 0 #878985,
          0 5px 6px rgba(50, 56, 56, 0.2),
          inset 1px 1px 0 rgba(255, 255, 255, 0.92),
          inset -1px -1px 0 rgba(113, 115, 111, 0.25);
        color: #172227;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        line-height: 1;
        text-align: center;
        transition:
          transform 120ms cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 120ms cubic-bezier(0.23, 1, 0.32, 1),
          filter 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .physical-key:hover {
        filter: brightness(1.035);
      }

      .physical-key:active,
      .physical-key.keyboard-pressed {
        transform: translateY(2px);
        box-shadow:
          0 1px 0 #878985,
          0 2px 3px rgba(50, 56, 56, 0.18),
          inset 1px 1px 0 rgba(86, 89, 85, 0.22);
      }

      .physical-key:focus-visible {
        z-index: 2;
        outline: 3px solid rgba(13, 109, 117, 0.5);
        outline-offset: 2px;
      }

      .micro-key {
        min-height: 31px;
        padding: 3px;
        border-radius: 6px;
        font-size: 8px;
        letter-spacing: -0.04em;
      }

      .shift-key {
        color: #422408;
        background: linear-gradient(180deg, #f7c763, var(--shift));
        border-color: #a95e12;
      }

      .alpha-key {
        color: #fff8fb;
        background: linear-gradient(180deg, #d992aa, var(--alpha));
        border-color: #793448;
      }

      .mode-key {
        color: #eff7f5;
        background: linear-gradient(180deg, var(--blue-top), var(--blue-mid));
        border-color: var(--blue-edge);
        box-shadow:
          0 3px 0 #273d47,
          0 5px 6px rgba(50, 56, 56, 0.23),
          inset 1px 1px 0 rgba(255, 255, 255, 0.28);
      }

      .on-key {
        color: #fff6e8;
        background: linear-gradient(180deg, var(--orange-top), var(--orange-mid));
        border-color: var(--orange-edge);
        box-shadow:
          0 3px 0 #764014,
          0 5px 6px rgba(50, 56, 56, 0.23),
          inset 1px 1px 0 rgba(255, 255, 255, 0.3);
      }

      .is-active {
        filter: saturate(1.35) brightness(1.08);
        box-shadow:
          0 1px 0 rgba(62, 49, 15, 0.8),
          inset 0 0 0 2px rgba(255, 255, 255, 0.38);
        transform: translateY(2px);
      }

      .d-pad {
        display: grid;
        grid-template-columns: 24px 34px 24px;
        grid-template-rows: 18px 26px 18px;
        justify-content: center;
        min-height: 66px;
      }

      .d-pad .physical-key {
        display: grid;
        min-height: 0;
        padding: 0;
        place-items: center;
        border-color: #526168;
        border-radius: 4px;
        background: linear-gradient(180deg, #839197, #58666c);
        box-shadow:
          0 2px 0 #36444a,
          inset 1px 1px 0 rgba(255, 255, 255, 0.32);
        color: #fbfdfc;
        font-size: 10px;
      }

      .d-pad .physical-key:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 #36444a;
      }

      .nav-up {
        grid-column: 2;
        grid-row: 1 / span 2;
        clip-path: polygon(50% 0, 100% 42%, 100% 100%, 0 100%, 0 42%);
      }

      .nav-left {
        grid-column: 1 / span 2;
        grid-row: 2;
        clip-path: polygon(0 50%, 42% 0, 100% 0, 100% 100%, 42% 100%);
      }

      .nav-center {
        z-index: 1;
        grid-column: 2;
        grid-row: 2;
        width: 28px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(180deg, #d2d8d6, #788589) !important;
        color: #1c272b !important;
        font-size: 7px !important;
      }

      .nav-right {
        grid-column: 2 / span 2;
        grid-row: 2;
        clip-path: polygon(0 0, 58% 0, 100% 50%, 58% 100%, 0 100%);
      }

      .nav-down {
        grid-column: 2;
        grid-row: 2 / span 2;
        align-self: end;
        clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%);
      }

      .keypad-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 2px 1px 7px;
        color: #596260;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .keypad-label::after {
        height: 1px;
        flex: 1;
        background: rgba(72, 80, 77, 0.32);
        content: "";
      }

      .scientific-grid,
      .numeric-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 7px;
      }

      .scientific-grid {
        margin-bottom: 13px;
      }

      .scientific-grid .physical-key {
        min-height: 45px;
        padding: 6px 2px 4px;
        color: #eff6f5;
        background: linear-gradient(180deg, var(--function-top), var(--function-mid));
        border-color: var(--function-edge);
        box-shadow:
          0 3px 0 #20282b,
          0 5px 6px rgba(49, 51, 50, 0.2),
          inset 1px 1px 0 rgba(255, 255, 255, 0.2),
          inset -1px -1px 0 rgba(15, 23, 25, 0.28);
        font-size: 12px;
      }

      .secondary-label {
        position: absolute;
        top: 3px;
        left: 0;
        width: 100%;
        overflow: hidden;
        color: #ffd26e;
        font-size: 6px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .secondary-label.alpha-label {
        color: #ef9dba;
      }

      .primary-label {
        display: block;
        margin-top: 4px;
        line-height: 1;
      }

      .scientific-grid .warm-key {
        color: #301f0a;
        background: linear-gradient(180deg, #efcb83, #d59c4e);
        border-color: #94642e;
        box-shadow:
          0 3px 0 #79501e,
          0 5px 6px rgba(49, 51, 50, 0.2),
          inset 1px 1px 0 rgba(255, 255, 255, 0.36);
      }

      .numeric-grid .physical-key {
        min-height: 54px;
        padding: 7px 3px 4px;
        border-radius: 8px;
        font-size: 22px;
        font-weight: 800;
      }

      .numeric-grid .utility-key {
        color: #452013;
        background: linear-gradient(180deg, #f0b97f, #d97a4d);
        border-color: #9b482e;
        font-size: 13px;
      }

      .numeric-grid .operator-key {
        color: #edf6f7;
        background: linear-gradient(180deg, #6e8994, #46636e);
        border-color: #2f4952;
      }

      .numeric-grid .equals-key {
        color: #fff7ee;
        background: linear-gradient(180deg, var(--coral-top), var(--coral-mid));
        border-color: var(--coral-edge);
        box-shadow:
          0 3px 0 #893021,
          0 5px 6px rgba(49, 51, 50, 0.22),
          inset 1px 1px 0 rgba(255, 255, 255, 0.37);
      }

      .numeric-grid .notation-key,
      .numeric-grid .ans-key {
        font-size: 11px;
      }

      .calculator-footer {
        display: flex;
        justify-content: space-between;
        margin: 15px 4px 0;
        color: #646c68;
        font-size: 7px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .workspace-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 12px 4px 2px;
      }

      .workspace-button {
        min-height: 31px;
        padding: 7px 10px;
        border: 1px solid rgba(194, 204, 208, 0.28);
        border-radius: 999px;
        background: rgba(35, 47, 55, 0.72);
        color: #edf4f5;
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        transition:
          transform 140ms cubic-bezier(0.23, 1, 0.32, 1),
          background-color 140ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .workspace-button:hover {
        background: #314c56;
      }

      .workspace-button:active {
        transform: scale(0.97);
      }

      .drawer-backdrop {
        position: fixed;
        z-index: 15;
        inset: 0;
        display: none;
        align-items: flex-end;
        justify-content: center;
        padding: 14px;
        background: rgba(12, 19, 22, 0.64);
      }

      .drawer-backdrop.is-open {
        display: flex;
      }

      .history-drawer {
        width: min(100%, 540px);
        max-height: min(80dvh, 640px);
        overflow: auto;
        padding: 19px;
        border: 1px solid #858d89;
        border-radius: 20px 20px 12px 12px;
        background: linear-gradient(160deg, #f6f4ed, #d7dad4);
        box-shadow: 0 -14px 36px rgba(0, 0, 0, 0.32);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 13px;
      }

      .drawer-head h2 {
        margin: 0;
        color: #1b2c31;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 23px;
      }

      .drawer-actions {
        display: flex;
        gap: 7px;
      }

      .drawer-actions button {
        border: 1px solid #9da39f;
        border-radius: 7px;
        background: #faf9f5;
        color: #304046;
        cursor: pointer;
        font-size: 11px;
        font-weight: 800;
        padding: 7px 9px;
      }

      .drawer-copy {
        margin: 0 0 12px;
        color: #586663;
        font-size: 12px;
        line-height: 1.45;
      }

      .record-list {
        display: grid;
        gap: 8px;
      }

      .record-item {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid rgba(110, 120, 116, 0.34);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        color: #203237;
        cursor: pointer;
        text-align: right;
      }

      .record-expression {
        display: block;
        overflow: hidden;
        color: #64716f;
        font-family: "Courier New", monospace;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .record-result {
        display: block;
        margin-top: 4px;
        font-family: "Courier New", monospace;
        font-size: 17px;
        font-weight: 700;
      }

      .empty-records {
        padding: 28px 10px;
        color: #66716e;
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 430px) {
        body {
          padding: 6px;
        }

        .calculator-body {
          min-height: 805px;
          padding: 16px 12px 22px;
          border-radius: 18px 18px 31px 31px;
        }

        .brand-row {
          margin-inline: 5px;
        }

        .top-controls {
          gap: 4px;
        }

        .scientific-grid,
        .numeric-grid {
          gap: 5px;
        }

        .scientific-grid .physical-key {
          min-height: 42px;
          font-size: 10px;
        }

        .numeric-grid .physical-key {
          min-height: 49px;
          font-size: 19px;
        }

        .numeric-grid .utility-key,
        .numeric-grid .notation-key,
        .numeric-grid .ans-key {
          font-size: 10px;
        }

        .secondary-label {
          font-size: 5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      :fullscreen,
      :fullscreen body {
        background: #111820;
      }

      :fullscreen .calculator-app {
        width: min(100%, 560px);
      }
    </style>
  </head>
  <body>
    <main class="calculator-app" aria-label="Toolyfi Scientific Calculator">
      <section class="calculator-body">
        <header class="brand-row">
          <div class="toolyfi-brand">
            Tool<span>yfi</span>
            <small class="model-line">Scientific Calculator</small>
          </div>
          <div class="quiet-mark">
            Browser-local math workspace<br />No manufacturer affiliation
          </div>
        </header>

        <section class="screen-shell" aria-label="Calculator display">
          <div class="lcd">
            <div class="lcd-status">
              <div class="state-flags" id="stateFlags"></div>
              <span class="is-on" id="statusLabel">READY</span>
            </div>
            <div class="expression-line" id="expressionLine" aria-live="polite"></div>
            <div class="result-line" id="resultLine" aria-live="polite">0</div>
            <div class="memory-line" id="memoryLine"></div>
          </div>
        </section>

        <section class="top-controls" aria-label="Calculator navigation and modes">
          <button
            class="physical-key micro-key shift-key"
            data-action="shift"
            aria-label="Toggle Shift"
          >
            SHIFT
          </button>
          <button
            class="physical-key micro-key alpha-key"
            data-action="alpha"
            aria-label="Toggle Alpha"
          >
            ALPHA
          </button>
          <div class="d-pad" aria-label="Expression navigation">
            <button
              class="physical-key nav-up"
              data-action="history-prev"
              aria-label="Previous calculation"
            >
              ▲
            </button>
            <button
              class="physical-key nav-left"
              data-action="cursor-left"
              aria-label="Move cursor left"
            >
              ◀
            </button>
            <button
              class="physical-key nav-center"
              data-action="open-records"
              aria-label="Open calculation records"
            >
              RCL
            </button>
            <button
              class="physical-key nav-right"
              data-action="cursor-right"
              aria-label="Move cursor right"
            >
              ▶
            </button>
            <button
              class="physical-key nav-down"
              data-action="history-next"
              aria-label="Next calculation"
            >
              ▼
            </button>
          </div>
          <button
            class="physical-key micro-key mode-key"
            data-action="mode"
            aria-label="Change calculator mode"
          >
            MODE
          </button>
          <button
            class="physical-key micro-key mode-key"
            data-action="setup"
            aria-label="Change display setup"
          >
            SETUP
          </button>
          <button
            class="physical-key micro-key on-key"
            data-action="on"
            aria-label="Turn calculator on or reset display"
          >
            ON
          </button>
        </section>

        <div class="keypad-label">Scientific functions</div>
        <section class="scientific-grid" aria-label="Scientific function keys">
          <button class="physical-key" data-action="calculate" aria-label="Calculate expression">
            <span class="primary-label">CALC</span>
          </button>
          <button
            class="physical-key"
            data-action="insert-frac"
            aria-label="Insert fraction division"
          >
            <span class="primary-label">a b/c</span>
          </button>
          <button
            class="physical-key"
            data-action="fraction-toggle"
            aria-label="Convert result between decimal and fraction"
          >
            <span class="primary-label">S⇔D</span>
          </button>
          <button class="physical-key" data-action="sqrt" aria-label="Square root">
            <span class="secondary-label">x²</span><span class="primary-label">√</span>
          </button>
          <button class="physical-key" data-action="square" aria-label="Square">
            <span class="secondary-label">√</span><span class="primary-label">x²</span>
          </button>

          <button class="physical-key" data-action="power" aria-label="Raise to a power">
            <span class="secondary-label">x√y</span><span class="primary-label">xʸ</span>
          </button>
          <button class="physical-key" data-action="root" aria-label="Insert nth root">
            <span class="secondary-label">xʸ</span><span class="primary-label">x√y</span>
          </button>
          <button class="physical-key" data-action="log" aria-label="Base 10 logarithm">
            <span class="secondary-label">10ˣ</span><span class="primary-label">log</span>
          </button>

    <div
      class="drawer-backdrop"
      id="drawerBackdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="recordsTitle"
    >
      <section class="history-drawer">
        <div class="drawer-head">
          <h2 id="recordsTitle">Calculation history</h2>
          <div class="drawer-actions">
            <button type="button" data-action="clear-records">Clear</button>
            <button type="button" data-action="close-records">Close</button>
          </div>
        </div>
        <p class="drawer-copy" id="drawerCopy">Select a saved result to reuse it in the display.</p>
        <div class="record-list" id="recordList"></div>
      </section>
    </div>

    <script>
      (() => {
        const $ = (selector) => document.querySelector(selector);
        const $$ = (selector) => Array.from(document.querySelectorAll(selector));
        const HISTORY_KEY = "toolyfi-scientific-history-v2";
        const STATS_KEY = "toolyfi-scientific-stats-v2";

        const state = {
          expression: "",
          cursor: 0,
          result: 0,
          lastAnswer: 0,
          resultText: "0",
          displayOverride: "",
          memory: 0,
          angle: "DEG",
          mode: "COMP",
          setup: "NORM",
          shift: false,
          alpha: false,
          hyp: false,
          status: "READY",
          error: false,
          history: readStored(HISTORY_KEY, []),
          stats: readStored(STATS_KEY, []),
          historyIndex: -1,
          tableRows: [],
        };

        const expressionLine = $("#expressionLine");
        const resultLine = $("#resultLine");
        const memoryLine = $("#memoryLine");
        const stateFlags = $("#stateFlags");
        const statusLabel = $("#statusLabel");
        const drawerBackdrop = $("#drawerBackdrop");
        const recordList = $("#recordList");
        const drawerCopy = $("#drawerCopy");
        const recordsTitle = $("#recordsTitle");
        const fullscreenButton = $("#fullscreenButton");

        function readStored(key, fallback) {
          try {
            const saved = JSON.parse(localStorage.getItem(key));
            return Array.isArray(saved) ? saved : fallback;
          } catch {
            return fallback;
          }
        }

        function saveStored(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch {
            // Local persistence is optional. The calculator remains usable without it.
          }
        }

        function vibrate() {
          try {
            if (navigator.vibrate) navigator.vibrate(6);
          } catch {
            // Vibration support is optional.
          }
        }

        function formatNumber(value) {
          if (!Number.isFinite(value)) throw new Error("Math error");
          if (Math.abs(value) < 1e-13) value = 0;
          if (state.setup === "FIX 2") return value.toFixed(2);
          if (state.setup === "FIX 4") return value.toFixed(4);
          if (state.setup === "SCI") return value.toExponential(6).replace("e+", "e");
          if (state.setup === "ENG") {
            if (value === 0) return "0";
            const exponent = Math.floor(Math.log10(Math.abs(value)) / 3) * 3;
            const coefficient = value / Math.pow(10, exponent);
            return `${Number(coefficient.toPrecision(8))}×10^${exponent}`;
          }
          return Number(value.toPrecision(12)).toString();
        }

        function normalizeExpression(value) {
          return value
            .replaceAll("×", "*")
            .replaceAll("÷", "/")
            .replaceAll("−", "-")
            .replaceAll("×10^", "*10^")
            .replaceAll("Ans", "ans")
            .replaceAll("√", "sqrt");
        }

        function tokenize(source) {
          const tokens = [];
          let index = 0;
          while (index < source.length) {
            const char = source[index];
            if (/\s/.test(char)) {
              index += 1;
              continue;
            }
            const number = source.slice(index).match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
            if (number) {
              tokens.push({ type: "number", value: Number(number[0]) });
              index += number[0].length;
              continue;
            }
            if (/[A-Za-zπ]/.test(char)) {
              const identifier = source.slice(index).match(/^[A-Za-zπ]+/)[0];
              tokens.push({ type: "identifier", value: identifier });
              index += identifier.length;
              continue;
            }
            if ("+-*/^!%(),".includes(char)) {
              tokens.push({ type: char, value: char });
              index += 1;
              continue;
            }
            throw new Error("Unsupported input");
          }
          tokens.push({ type: "eof", value: "" });
          return tokens;
        }

        function factorial(value) {
          if (!Number.isInteger(value) || value < 0 || value > 170)
            throw new Error("Factorial domain");
          let answer = 1;
          for (let number = 2; number <= value; number += 1) answer *= number;
          return answer;
        }

        class ExpressionParser {
          constructor(source, variables = {}) {
            this.tokens = tokenize(normalizeExpression(source));
            this.position = 0;
            this.variables = variables;
          }

          current() {
            return this.tokens[this.position];
          }

          take(type) {
            if (this.current().type !== type) throw new Error("Check expression");
            return this.tokens[this.position++];
          }

          parse() {
            const value = this.parseExpression();
            if (this.current().type !== "eof") throw new Error("Check expression");
            if (!Number.isFinite(value)) throw new Error("Math error");
            return value;
          }

          parseExpression() {
            let value = this.parseTerm();
            while (["+", "-"].includes(this.current().type)) {
              const operator = this.current().type;
              this.position += 1;
              const next = this.parseTerm();
              value = operator === "+" ? value + next : value - next;
            }
            return value;
          }

          parseTerm() {
            let value = this.parseUnary();
            while (["*", "/"].includes(this.current().type)) {
              const operator = this.current().type;
              this.position += 1;
              const next = this.parseUnary();
              if (operator === "/" && next === 0) throw new Error("Division by zero");
              value = operator === "*" ? value * next : value / next;
            }
            return value;
          }

          parseUnary() {
            if (this.current().type === "+") {
              this.position += 1;
              return this.parseUnary();
            }
            if (this.current().type === "-") {
              this.position += 1;
              return -this.parseUnary();
            }
            return this.parsePower();
          }

          parsePower() {
            const base = this.parsePostfix();
            if (this.current().type === "^") {
              this.position += 1;
              const exponent = this.parseUnary();
              const value = Math.pow(base, exponent);
              if (!Number.isFinite(value)) throw new Error("Math error");
              return value;
            }
            return base;
          }

          parsePostfix() {
            let value = this.parsePrimary();
            while (["!", "%"].includes(this.current().type)) {
              const operator = this.current().type;
              this.position += 1;
              value = operator === "!" ? factorial(value) : value / 100;
            }
            return value;
          }

          parsePrimary() {
            const token = this.current();
            if (token.type === "number") {
              this.position += 1;
              return token.value;
            }
            if (token.type === "(") {
              this.position += 1;
              const value = this.parseExpression();
              this.take(")");
              return value;
            }
            if (token.type === "identifier") {
              this.position += 1;
              const name = token.value;
              if (this.current().type === "(") {
                this.position += 1;
                const args = [];
                if (this.current().type !== ")") {
                  args.push(this.parseExpression());
                  while (this.current().type === ",") {
                    this.position += 1;
                    args.push(this.parseExpression());
                  }
                }
                this.take(")");
                return this.callFunction(name, args);
              }
              return this.readConstant(name);
            }
            throw new Error("Check expression");
          }

          readConstant(name) {
            const lower = name.toLowerCase();
            if (name === "π" || lower === "pi") return Math.PI;
            if (lower === "e") return Math.E;
            if (lower === "ans") return state.lastAnswer;
            if (Object.hasOwn(this.variables, name)) return this.variables[name];
            if (Object.hasOwn(this.variables, lower)) return this.variables[lower];
            throw new Error("Unknown value");
          }

          callFunction(name, args) {
            const lower = name.toLowerCase();
            const value = args[0];
            const requireOne = () => {
              if (args.length !== 1) throw new Error("Function input");
            };
            const toRadians = (angle) => {
              if (state.angle === "DEG") return (angle * Math.PI) / 180;
              if (state.angle === "GRAD") return (angle * Math.PI) / 200;
              return angle;
            };
            const fromRadians = (angle) => {
              if (state.angle === "DEG") return (angle * 180) / Math.PI;
              if (state.angle === "GRAD") return (angle * 200) / Math.PI;
              return angle;
            };
            if (lower === "sin") {
              requireOne();
              return Math.sin(toRadians(value));
            }
            if (lower === "cos") {
              requireOne();
              return Math.cos(toRadians(value));
            }
            if (lower === "tan") {
              requireOne();
              return Math.tan(toRadians(value));
            }
            if (lower === "cot") {
              requireOne();
              return 1 / Math.tan(toRadians(value));
            }
            if (lower === "asin") {
              requireOne();
              return fromRadians(Math.asin(value));
            }
            if (lower === "acos") {
              requireOne();
              return fromRadians(Math.acos(value));
            }
            if (lower === "atan") {
              requireOne();
              return fromRadians(Math.atan(value));
            }
            if (lower === "sinh") {
              requireOne();
              return Math.sinh(value);
            }
            if (lower === "cosh") {
              requireOne();
              return Math.cosh(value);
            }
            if (lower === "tanh") {
              requireOne();
              return Math.tanh(value);
            }
            if (lower === "asinh") {
              requireOne();
              return Math.asinh(value);
            }
            if (lower === "acosh") {
              requireOne();
              return Math.acosh(value);
            }
            if (lower === "atanh") {
              requireOne();
              return Math.atanh(value);
            }
            if (lower === "sqrt") {
              requireOne();
              return Math.sqrt(value);
            }
            if (lower === "root") {
              if (args.length !== 2) throw new Error("Root input");
              return Math.pow(args[1], 1 / args[0]);
            }
            if (lower === "log") {
              requireOne();
              return Math.log10(value);
            }
            if (lower === "ln") {
              requireOne();
              return Math.log(value);
            }
            if (lower === "exp") {
              requireOne();
              return Math.exp(value);
            }
            if (lower === "pow10") {
              requireOne();
              return Math.pow(10, value);
            }
            if (lower === "abs") {
              requireOne();
              return Math.abs(value);
            }
            if (lower === "fact") {
              requireOne();
              return factorial(value);
            }
            if (lower === "npr") {
              if (args.length !== 2) throw new Error("nPr input");
              return factorial(args[0]) / factorial(args[0] - args[1]);
            }
            if (lower === "ncr") {
              if (args.length !== 2) throw new Error("nCr input");
              return factorial(args[0]) / (factorial(args[1]) * factorial(args[0] - args[1]));
            }
            if (lower === "rand") {
              if (args.length !== 0) throw new Error("Random input");
              return Math.random();
            }
            throw new Error("Unsupported function");
          }
        }

        function evaluateExpression(expression, variables = {}) {
          return new ExpressionParser(expression, variables).parse();
        }

        function insert(value) {
          state.expression = `${state.expression.slice(0, state.cursor)}${value}${state.expression.slice(state.cursor)}`;
          state.cursor += value.length;
          state.displayOverride = "";
          state.error = false;
          state.status = "INPUT";
          state.historyIndex = -1;
          render();
        }

        function replaceExpression(value) {
          state.expression = String(value);
          state.cursor = state.expression.length;
          state.displayOverride = "";
          state.error = false;
          render();
        }

        function insertFunction(name) {
          insert(`${name}(`);
        }

        function applyShift(action) {
          if (!state.shift) return action;
          const shiftedActions = {
            sqrt: "square",
            square: "sqrt",
            power: "root",
            log: "pow10",
            ln: "exp",
            sin: "asin",
            cos: "acos",
            tan: "atan",
            pi: "e-constant",
            perm: "comb",
            mode: "angle",
          };
          if (shiftedActions[action]) {
            state.shift = false;
            return shiftedActions[action];
          }
          return action;
        }

        function applyAlpha(action) {
          if (!state.alpha) return action;
          const alphaActions = { lparen: "variable-x", rparen: "variable-y" };
          if (alphaActions[action]) {
            state.alpha = false;
            return alphaActions[action];
          }
          return action;
        }

        function handleAction(rawAction) {
          let action = applyAlpha(applyShift(rawAction));
          vibrate();
          if (action === "shift") {
            state.shift = !state.shift;
            state.status = state.shift ? "SHIFT" : "READY";
          } else if (action === "alpha") {
            state.alpha = !state.alpha;
            state.status = state.alpha ? "ALPHA" : "READY";
          } else if (action === "mode") {
            state.mode = state.mode === "COMP" ? "STAT" : state.mode === "STAT" ? "TABLE" : "COMP";
            state.status = `${state.mode} MODE`;
          } else if (action === "angle") {
            state.angle = state.angle === "DEG" ? "RAD" : state.angle === "RAD" ? "GRAD" : "DEG";
            state.status = `${state.angle} MODE`;
          } else if (action === "setup") {
            const options = ["NORM", "FIX 2", "FIX 4", "SCI", "ENG"];
            state.setup = options[(options.indexOf(state.setup) + 1) % options.length];
            state.status = state.setup;
          } else if (action === "on") {
            state.error = false;
            state.status = "READY";
            state.displayOverride = "";
          } else if (action === "calculate") {
            calculate();
            return;
          } else if (action === "delete") {
            if (state.cursor > 0) {
              state.expression = `${state.expression.slice(0, state.cursor - 1)}${state.expression.slice(state.cursor)}`;
              state.cursor -= 1;
            }
            state.displayOverride = "";
            state.status = "INPUT";
          } else if (action === "all-clear") {
            state.expression = "";
            state.cursor = 0;
            state.result = 0;
            state.resultText = "0";
            state.displayOverride = "";
            state.error = false;
            state.status = "READY";
          } else if (action === "cursor-left") {
            state.cursor = Math.max(0, state.cursor - 1);
          } else if (action === "cursor-right") {
            state.cursor = Math.min(state.expression.length, state.cursor + 1);
          } else if (action === "history-prev") {
            browseHistory(1);
          } else if (action === "history-next") {
            browseHistory(-1);
          } else if (action === "open-records") {
            openRecords();
            return;
          } else if (action === "close-records") {
            closeRecords();
            return;
          } else if (action === "clear-records") {
            state.history = [];
            state.tableRows = [];
            saveStored(HISTORY_KEY, state.history);
            state.status = "HISTORY CLEARED";
          } else if (action === "fullscreen") {
            toggleFullscreen();
            return;
          } else if (action === "insert-frac") {
            insert("÷");
            return;
          } else if (action === "fraction-toggle") {
            toggleFraction();
            return;
          } else if (action === "sqrt") {
            insertFunction("sqrt");
            return;
          } else if (action === "square") {
            insert("^2");
            return;
          } else if (action === "power") {
            insert("^");
            return;
          } else if (action === "root") {
            insertFunction("root");
            return;
          } else if (action === "log") {
            insertFunction("log");
            return;
          } else if (action === "ln") {
            insertFunction("ln");
            return;
          } else if (action === "pow10") {
            insertFunction("pow10");
            return;
          } else if (action === "exp") {
            insertFunction("exp");
            return;
          } else if (action === "negative") {
            insert("−");
            return;
          } else if (action === "engineering") {
            state.setup = "ENG";
            state.status = "ENG FORMAT";
          } else if (action === "hyp") {
            state.hyp = !state.hyp;
            state.status = state.hyp ? "HYP" : "READY";
          } else if (["sin", "cos", "tan", "asin", "acos", "atan"].includes(action)) {
            const mapping = {
              sin: state.hyp ? "sinh" : "sin",
              cos: state.hyp ? "cosh" : "cos",
              tan: state.hyp ? "tanh" : "tan",
              asin: state.hyp ? "asinh" : "asin",
              acos: state.hyp ? "acosh" : "acos",
              atan: state.hyp ? "atanh" : "atan",
            };
            state.hyp = false;
            insertFunction(mapping[action]);
            return;
          } else if (action === "lparen") {
            insert("(");
            return;
          } else if (action === "rparen") {
            insert(")");
            return;
          } else if (action === "variable-x") {
            insert("x");
            return;
          } else if (action === "variable-y") {
            insert("y");
            return;
          } else if (action === "pi") {
            insert("π");
            return;
          } else if (action === "e-constant") {
            insert("e");
            return;
          } else if (action === "perm") {
            insertFunction("nPr");
            return;
          } else if (action === "comb") {
            insertFunction("nCr");
            return;
          } else if (action === "scientific") {
            insert("×10^");
            return;
          } else if (action === "memory-add" || action === "memory-subtract") {
            memoryChange(action === "memory-add" ? 1 : -1);
            return;
          } else if (action === "memory-recall") {
            insert(formatNumber(state.memory));
            return;
          } else if (action === "memory-clear") {
            state.memory = 0;
            state.status = "MEMORY CLEAR";
          } else if (action === "random") {
            insert("rand()");
            return;
          } else if (action === "absolute") {
            insertFunction("abs");
            return;
          } else if (action === "stat-summary") {
            showStatSummary();
            return;
          } else if (action === "table-mode") {
            state.mode = "TABLE";
            state.status = "TABLE: USE ALPHA + ( FOR x";
          } else if (action === "answer") {
            insert(formatNumber(state.lastAnswer));
            return;
          }
          render();
        }

        function memoryChange(direction) {
          try {
            const value = state.expression
              ? evaluateExpression(state.expression)
              : state.lastAnswer;
            state.memory += direction * value;
            state.status = direction > 0 ? "M+" : "M−";
            state.error = false;
          } catch (error) {
            showError(error);
          }
          render();
        }

        function calculate() {
          if (!state.expression) return;
          try {
            state.error = false;
            const usesX = /\bx\b/i.test(state.expression);
            if (state.mode === "TABLE" && usesX) {
              state.tableRows = [-2, -1, 0, 1, 2].map((x) => ({
                expression: `x = ${x}`,
                result: formatNumber(evaluateExpression(state.expression, { x })),
              }));
              state.status = "TABLE READY";
              state.resultText = `${state.tableRows.length} values`;
              state.displayOverride = "";
              openRecords("table");
              return;
            }
            const value = evaluateExpression(state.expression);
            state.result = value;
            state.lastAnswer = value;
            state.resultText = formatNumber(value);
            state.displayOverride = "";
            state.status = "CALCULATED";
            if (state.mode === "STAT") {
              state.stats.unshift(value);
              state.stats = state.stats.slice(0, 99);
              saveStored(STATS_KEY, state.stats);
              state.status = `STAT n=${state.stats.length}`;
            }
            state.history.unshift({
              expression: state.expression,
              result: state.resultText,
              value,
            });
            state.history = state.history.slice(0, 50);
            saveStored(HISTORY_KEY, state.history);
            state.cursor = state.expression.length;
            render();
          } catch (error) {
            showError(error);
            render();
          }
        }

        function showError(error) {
          state.error = true;
          state.resultText = error instanceof Error ? error.message : "Math error";
          state.status = "CHECK INPUT";
        }

        function toggleFraction() {
          if (!Number.isFinite(state.result)) {
            state.status = "CALCULATE FIRST";
            render();
            return;
          }
          if (state.displayOverride) {
            state.displayOverride = "";
            state.resultText = formatNumber(state.result);
            state.status = "DECIMAL";
          } else {
            state.displayOverride = numberToFraction(state.result);
            state.status = "FRACTION";
          }
          render();
        }

        function numberToFraction(value) {
          const sign = value < 0 ? "−" : "";
          const target = Math.abs(value);
          if (Number.isInteger(target)) return `${sign}${target}/1`;
          let previousNumerator = 0;
          let numerator = 1;
          let previousDenominator = 1;
          let denominator = 0;
          let remainder = target;
          for (let step = 0; step < 20; step += 1) {
            const whole = Math.floor(remainder);
            const nextNumerator = whole * numerator + previousNumerator;
            const nextDenominator = whole * denominator + previousDenominator;
            previousNumerator = numerator;
            previousDenominator = denominator;
            numerator = nextNumerator;
            denominator = nextDenominator;
            if (Math.abs(target - numerator / denominator) < 1e-10 || denominator > 1000000) break;
            remainder = 1 / (remainder - whole);
          }
          return `${sign}${numerator}/${denominator}`;
        }

        function showStatSummary() {
          if (!state.stats.length) {
            state.status = "STAT EMPTY";
            state.resultText = "0";
            render();
            return;
          }
          const mean = state.stats.reduce((total, value) => total + value, 0) / state.stats.length;
          const variance =
            state.stats.reduce((total, value) => total + Math.pow(value - mean, 2), 0) /
            state.stats.length;
          state.resultText = `x̄=${formatNumber(mean)} σ=${formatNumber(Math.sqrt(variance))}`;
          state.status = `STAT n=${state.stats.length}`;
          state.error = false;
          render();
        }

        function browseHistory(direction) {
          if (!state.history.length) {
            state.status = "HISTORY EMPTY";
            render();
            return;
          }
          state.historyIndex = Math.max(
            -1,
            Math.min(state.history.length - 1, state.historyIndex + direction),
          );
          if (state.historyIndex === -1) {
            state.status = "INPUT";
            render();
            return;
          }
          const entry = state.history[state.historyIndex];
          replaceExpression(entry.expression);
          state.result = Number(entry.value) || 0;
          state.lastAnswer = state.result;
          state.resultText = entry.result;
          state.status = `HISTORY ${state.historyIndex + 1}`;
          render();
        }

        function openRecords(kind = "history") {
          const isTable = kind === "table";
          recordsTitle.textContent = isTable ? "Table values" : "Calculation history";
          drawerCopy.textContent = isTable
            ? "For the current expression, x is evaluated from −2 through 2. Select a result to reuse it."
            : "Stored locally in this browser. Select an entry to reuse its result.";
          recordList.replaceChildren();
          const records = isTable ? state.tableRows : state.history;
          if (!records.length) {
            const empty = document.createElement("p");
            empty.className = "empty-records";
            empty.textContent = isTable
              ? "Enter an expression with x in TABLE mode."
              : "No calculations saved yet.";
            recordList.append(empty);
          } else {
            records.forEach((entry) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "record-item";
              button.setAttribute("aria-label", `Reuse ${entry.result}`);
              const expression = document.createElement("span");
              expression.className = "record-expression";
              expression.textContent = entry.expression;
              const result = document.createElement("span");
              result.className = "record-result";
              result.textContent = `= ${entry.result}`;
              button.append(expression, result);
              button.addEventListener("click", () => {
                replaceExpression(entry.result);
                state.status = "RECALLED";
                closeRecords();
                render();
              });
              recordList.append(button);
            });
          }
          drawerBackdrop.classList.add("is-open");
        }

        function closeRecords() {
          drawerBackdrop.classList.remove("is-open");
        }

        async function toggleFullscreen() {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
          } catch {
            document.body.classList.toggle("fullscreen-fallback");
          }
          updateFullscreenButton();
        }

        function updateFullscreenButton() {
          const isFullscreen =
            Boolean(document.fullscreenElement) ||
            document.body.classList.contains("fullscreen-fallback");
          fullscreenButton.textContent = isFullscreen ? "Exit fullscreen" : "Fullscreen";
          fullscreenButton.setAttribute(
            "aria-label",
            isFullscreen ? "Exit fullscreen" : "Open fullscreen",
          );
        }

        function renderExpression() {
          expressionLine.replaceChildren();
          const before = document.createTextNode(state.expression.slice(0, state.cursor) || "0");
          const caret = document.createElement("span");
          caret.className = "lcd-caret";
          caret.setAttribute("aria-hidden", "true");
          const after = document.createTextNode(state.expression.slice(state.cursor));
          expressionLine.append(before, caret, after);
          expressionLine.scrollLeft = expressionLine.scrollWidth;
        }

        function render() {
          renderExpression();
          const flags = [state.mode, state.angle, state.setup];
          if (state.shift) flags.push("SHIFT");
          if (state.alpha) flags.push("ALPHA");
          if (state.hyp) flags.push("HYP");
          stateFlags.textContent = flags.join(" ");
          statusLabel.textContent = state.status;
          resultLine.textContent = state.displayOverride || state.resultText || "0";
          resultLine.classList.toggle("error", state.error);
          memoryLine.textContent = state.memory === 0 ? "" : `M ${formatNumber(state.memory)}`;
          $$("[data-action='shift']").forEach((button) =>
            button.classList.toggle("is-active", state.shift),
          );
          $$("[data-action='alpha']").forEach((button) =>
            button.classList.toggle("is-active", state.alpha),
          );
          $$("[data-action='hyp']").forEach((button) =>
            button.classList.toggle("is-active", state.hyp),
          );
        }

        function dispatchKeyboard(key) {
          const keyMap = {
            Enter: "calculate",
            "=": "calculate",
            Backspace: "delete",
            Escape: "all-clear",
            ArrowLeft: "cursor-left",
            ArrowRight: "cursor-right",
            ArrowUp: "history-prev",
            ArrowDown: "history-next",
          };
          if (
            /^[0-9]$/.test(key) ||
            [".", "+", "-", "*", "/", "(", ")", "^", "%", "!"].includes(key)
          ) {
            const visible = { "*": "×", "/": "÷", "-": "−" }[key] || key;
            insert(visible);
            return true;
          }
          if (keyMap[key]) {
            handleAction(keyMap[key]);
            return true;
          }
          return false;
        }

        document.addEventListener("click", (event) => {
          const button = event.target.closest("button");
          if (!button) return;
          if (button.dataset.insert) {
            vibrate();
            insert(button.dataset.insert);
          } else if (button.dataset.action) {
            handleAction(button.dataset.action);
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (dispatchKeyboard(event.key)) {
            event.preventDefault();
            const matching = $$("[data-insert], [data-action]").find(
              (button) =>
                button.dataset.insert === event.key || button.dataset.action === event.key,
            );
            if (matching) {
              matching.classList.add("keyboard-pressed");
              window.setTimeout(() => matching.classList.remove("keyboard-pressed"), 100);
            }
          }
        });

        drawerBackdrop.addEventListener("click", (event) => {
          if (event.target === drawerBackdrop) closeRecords();
        });
        document.addEventListener("fullscreenchange", updateFullscreenButton);
        render();
      })();
    </script>
  </body>
</html>
